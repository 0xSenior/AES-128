services:
  api:
    build:
      context: .
      dockerfile: python_api/Dockerfile
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./python_api/app:/app/app
      - ./frontend:/app/frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  test:
    build:
      context: .
      dockerfile: python_api/Dockerfile
    working_dir: /app
    volumes:
      - ./python_api/app:/app/app
      - ./python_api/tests:/app/tests
    command: pytest -q